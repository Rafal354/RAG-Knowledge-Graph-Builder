<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Adding article</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Add artice - file with .txt extension</h1>

  <label for="title-input">Title</label>
  <input id="title-input" type="text" placeholder="Title will be assumed from file name" />

  <div id="drop-zone">
    Drop file here (.txt)<br />
    <small>Click to browse from computer</small>
    <input id="file-input" type="file" accept=".txt" />
  </div>
  <div id="file-name"></div>
  <div id="preview"></div>
  <button id="send-btn" disabled>Send</button>
  <div id="status"></div>

  <script src="script.js"></script>
</body>
</html>
