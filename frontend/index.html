<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Knowledge Graph Builder</title>
  <link rel="stylesheet" href="styles.css?v=12" />
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <div id="toast-container"></div>
  <h1>Knowledge Graph Builder</h1>
  <div class="layout">
    <div class="col-left">
      <div id="drop-zone">
        <div class="drop-icon">&#8679;</div>
        <div>Drop .txt file here</div>
        <small>or click to browse</small>
        <input id="file-input" type="file" accept=".txt" />
      </div>
      <div id="file-name"></div>
      <div id="title"></div>
      <div id="preview"></div>
    </div>

    <div class="col-right">
      <div class="control-panel">
        <div class="control-panel-header">Extraction settings</div>
      <div class="select-row">
        <div class="select-col">
          <label for="model-select">Model</label>
          <select id="model-select">
        <optgroup label="Anthropic">
          <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
          <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
          <option value="claude-opus-4-6">Claude Opus 4.6</option>
        </optgroup>
        <optgroup label="OpenAI">
          <option value="gpt-4o-mini">GPT-4o mini</option>
          <option value="gpt-4o">GPT-4o</option>
        </optgroup>
        <optgroup label="Google">
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
          <option value="gemini-1.5-flash-8b">Gemini 1.5 Flash 8B</option>
        </optgroup>
        <optgroup label="OpenRouter">
          <option value="google/gemma-4-26b-a4b-it">Gemma 4 26B A4B</option>
          <option value="google/gemma-4-31b-it">Gemma 4 31B</option>
          <option value="openai/gpt-oss-20b">GPT-OSS 20B</option>
          <option value="nvidia/nemotron-3-nano-30b-a3b:free">Nemotron 3 Nano 30B A3B</option>
          <option value="mistralai/mistral-small-3.2-24b-instruct">Mistral Small 3.2 24B</option>
        </optgroup>
        <optgroup label="Alibaba Cloud">
          <option value="qwen3-14b">Qwen3-14B</option>
          <option value="qwen3-30b-a3b-instruct-2507">Qwen3-30B-A3B-Instruct</option>
          <option value="qwen3-32b">Qwen3-32B</option>
        </optgroup>
        <optgroup id="local-models-group" label="Local (LM Studio)">
          <option disabled value="">Loading...</option>
        </optgroup>
      </select>
        </div>
        <div class="select-col">
          <label for="prompt-select">Prompt</label>
          <div class="prompt-select-row">
            <select id="prompt-select"><option disabled value="">Loading...</option></select>
            <div class="prompt-menu-wrap">
              <button id="prompt-menu-btn" type="button" class="btn-icon btn-secondary" title="Prompt options">&#8943;</button>
              <div id="prompt-menu" class="prompt-menu hidden">
                <div class="prompt-menu-item" id="prompt-menu-preview">Preview</div>
                <div class="prompt-menu-item" id="prompt-menu-add-structured">Add structured</div>
                <div class="prompt-menu-item" id="prompt-menu-add-custom">Add custom</div>
                <div class="prompt-menu-separator"></div>
                <div class="prompt-menu-item prompt-menu-item--danger" id="prompt-menu-delete">Delete</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="send-btn" disabled>Send</button>
        <button id="clear-graph-btn" class="btn-danger" type="button">Clear graph</button>
      </div>

      <div id="status"></div>
      </div>
    </div>
  </div>

  <div id="manual-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Manual Graph Entry</h2>
        <button id="manual-cancel-btn" class="modal-close" type="button">&times;</button>
      </div>
      <div class="manual-fields">
        <div class="manual-file-row">
          <label class="manual-file-label" for="manual-file-input">Load from .txt</label>
          <input id="manual-file-input" type="file" accept=".txt" />
          <span id="manual-file-name"></span>
        </div>
        <input id="manual-title" type="text" placeholder="Title (e.g. my graph)" />
        <textarea id="manual-relations" rows="12" placeholder="One relation per line:&#10;Entity A -> relation -> Entity B&#10;Entity B -> other relation -> Entity C"></textarea>
      </div>
      <div class="manual-actions">
        <button id="manual-save-btn" type="button">Save graph</button>
        <button id="manual-cancel-btn2" type="button" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="prompt-preview-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 style="margin:0;" id="prompt-preview-title">Prompt preview</h2>
          <div id="prompt-preview-subtitle" style="font-size:11px;color:var(--text-muted);margin-top:2px;"></div>
        </div>
        <button id="prompt-preview-close-btn" class="modal-close" type="button">&times;</button>
      </div>
      <div id="prompt-preview-config"></div>
      <div id="prompt-preview-full" class="hidden">
        <div class="prompt-preview-divider">Full prompt</div>
        <div id="prompt-preview-full-content"></div>
      </div>
    </div>
  </div>

  <div id="prompt-structured-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Add Structured Prompt</h2>
        <button id="prompt-structured-cancel-btn" class="modal-close" type="button">&times;</button>
      </div>
      <div class="manual-fields">
        <div class="form-field">
          <label for="prompt-name-input">Name</label>
          <input id="prompt-name-input" type="text" placeholder="e.g. News articles PL" />
        </div>
        <div class="form-field">
          <label for="prompt-language-input">Language</label>
          <select id="prompt-language-input">
            <option value="pl">Polish (PL)</option>
            <option value="en">English (EN)</option>
          </select>
        </div>
        <div class="form-field">
          <label for="prompt-entity-types-input">Entity types <span class="field-hint">(one per line, starting with -)</span></label>
          <textarea id="prompt-entity-types-input" rows="6" placeholder="- people&#10;- organizations&#10;- cities&#10;- events"></textarea>
        </div>
        <div class="form-field">
          <label for="prompt-rules-input">Rules <span class="field-hint">(one per line, starting with -)</span></label>
          <textarea id="prompt-rules-input" rows="5" placeholder="- Write entities and relations in English&#10;- Do not duplicate relations in reverse order"></textarea>
        </div>
        <div class="form-field">
          <label for="prompt-examples-positive-input">Examples of correct relations <span class="field-hint">(optional)</span></label>
          <textarea id="prompt-examples-positive-input" rows="4" placeholder="John Smith -> directed -> Film XYZ&#10;Film XYZ -> produced by -> Studio ABC"></textarea>
        </div>
        <div class="form-field">
          <label for="prompt-examples-negative-input">Examples of relations NOT to extract <span class="field-hint">(optional)</span></label>
          <textarea id="prompt-examples-negative-input" rows="3" placeholder="Character A -> kills -> Character B  (fictional relation)"></textarea>
        </div>
      </div>
      <div class="manual-actions">
        <button id="prompt-structured-save-btn" type="button">Save prompt</button>
        <button id="prompt-structured-cancel-btn2" type="button" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="prompt-custom-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Add Custom Prompt</h2>
        <button id="prompt-custom-cancel-btn" class="modal-close" type="button">&times;</button>
      </div>
      <div class="manual-fields">
        <div class="form-field">
          <label for="prompt-custom-name-input">Name</label>
          <input id="prompt-custom-name-input" type="text" placeholder="e.g. My custom prompt" />
        </div>
        <div class="form-field">
          <label for="prompt-custom-language-input">Language</label>
          <select id="prompt-custom-language-input">
            <option value="pl">Polish (PL)</option>
            <option value="en">English (EN)</option>
          </select>
        </div>
        <div class="form-field">
          <label for="prompt-custom-content-input">Prompt instructions <span class="field-hint">Article title, text and (for existing graph) graph content will be appended automatically</span></label>
          <textarea id="prompt-custom-content-input" rows="14" placeholder="Build a knowledge graph from the article below.&#10;&#10;Extract all entities and relations...&#10;&#10;Return the result in this format:&#10;[RELATIONS]&#10;entity_1 -> relation -> entity_2"></textarea>
        </div>
      </div>
      <div class="manual-actions">
        <button id="prompt-custom-save-btn" type="button">Save prompt</button>
        <button id="prompt-custom-cancel-btn2" type="button" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="graph-section">
    <h2>Knowledge Graph</h2>
    <div id="graph-container"></div>
  </div>

  <div id="history-section">
    <div class="history-panel">
      <div class="history-header">
        <h2>Graph History</h2>
        <div class="history-header-actions">
          <button id="compare-btn" type="button" class="btn-secondary">Evaluate</button>
          <button id="manual-toggle-btn" type="button" class="btn-secondary">+ Add manually</button>
          <button id="load-latest-btn" type="button" class="btn-secondary">Load latest</button>
        </div>
      </div>
      <div id="graph-history"></div>
    </div>
  </div>

  <div id="eval-modal" class="modal-overlay hidden">
    <div class="modal modal--wide">
      <div class="modal-header">
        <h2>Graph Evaluation</h2>
        <button id="eval-close-btn" class="modal-close" type="button">&times;</button>
      </div>
      <div style="display:flex;gap:16px;margin-bottom:16px;align-items:flex-end;">
        <div style="flex:1 1 0%;min-width:0;">
          <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Graph</label>
          <select id="eval-graph-a" style="width:100%;"></select>
        </div>
        <div style="flex:1 1 0%;min-width:0;">
          <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Reference graph <span style="opacity:0.6">(optional)</span></label>
          <select id="eval-ref-graph" style="width:100%;"></select>
        </div>
        <div style="flex:0 0 180px;">
          <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;">Judge model</label>
          <select id="eval-model" style="width:100%;"></select>
        </div>
        <div style="flex:0 0 auto;">
          <label style="font-size:11px;display:block;margin-bottom:4px;visibility:hidden">_</label>
          <button id="eval-run-btn" type="button" style="width:auto;">Run</button>
        </div>
      </div>
      <div id="eval-results"></div>
      <div id="eval-history-section" style="margin-top:8px;">
        <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;border-top:1px solid var(--border);padding-top:14px;">History</div>
        <div id="eval-history-list"></div>
      </div>
    </div>
  </div>

  <div id="eval-detail-modal" class="modal-overlay hidden">
    <div class="modal modal--wide">
      <div class="modal-header">
        <div>
          <h2 style="margin:0;">Evaluation Details</h2>
          <div id="eval-detail-subtitle" style="font-size:12px;color:var(--text-muted);margin-top:2px;"></div>
        </div>
        <button id="eval-detail-close-btn" class="modal-close" type="button">&times;</button>
      </div>
      <div id="eval-detail-content"></div>
    </div>
  </div>

  <script src="script.js?v=42"></script>
</body>
</html>
