<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Knowledge Graph Builder</title>
  <link rel="stylesheet" href="styles.css?v=12" />
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <h1>Knowledge Graph Builder</h1>
  <div class="layout">
    <div class="col-left">
      <div id="drop-zone">
        <div class="drop-icon">&#8679;</div>
        <div>Drop .txt file here</div>
        <small>or click to browse</small>
        <input id="file-input" type="file" accept=".txt" />
      </div>
      <div id="file-name"></div>
      <div id="title"></div>
      <div id="preview"></div>
    </div>

    <div class="col-right">
      <label for="model-select">Model</label>
      <select id="model-select">
        <optgroup label="Anthropic">
          <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
          <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
          <option value="claude-opus-4-6">Claude Opus 4.6</option>
        </optgroup>
        <optgroup label="OpenAI">
          <option value="gpt-4o-mini">GPT-4o mini</option>
          <option value="gpt-4o">GPT-4o</option>
        </optgroup>
        <optgroup label="Google">
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
          <option value="gemini-1.5-flash-8b">Gemini 1.5 Flash 8B</option>
        </optgroup>
        <optgroup label="OpenRouter">
          <option value="google/gemma-4-26b-a4b-it:free">Gemma 4 26B A4B</option>
          <option value="google/gemma-4-31b-it:free">Gemma 4 31B</option>
          <option value="openai/gpt-oss-20b:free">GPT-OSS 20B</option>
          <option value="nvidia/nemotron-3-nano-30b-a3b:free">Nemotron 3 Nano 30B A3B</option>
        </optgroup>
        <optgroup label="Alibaba Cloud">
          <option value="qwen3-14b">Qwen3-14B</option>
          <option value="qwen3-30b-a3b-instruct-2507">Qwen3-30B-A3B-Instruct</option>
        </optgroup>
        <optgroup id="local-models-group" label="Local (LM Studio)">
          <option disabled value="">Loading...</option>
        </optgroup>
      </select>

      <div class="actions">
        <button id="send-btn" disabled>Send</button>
        <button id="clear-graph-btn" class="btn-danger" type="button">Clear graph</button>
      </div>

      <div id="status"></div>
    </div>
  </div>

  <div id="manual-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Manual Graph Entry</h2>
        <button id="manual-cancel-btn" class="modal-close" type="button">&times;</button>
      </div>
      <div class="manual-fields">
        <input id="manual-title" type="text" placeholder="Title (e.g. my graph)" />
        <div class="manual-file-row">
          <label class="manual-file-label" for="manual-file-input">Load from .txt</label>
          <input id="manual-file-input" type="file" accept=".txt" />
          <span id="manual-file-name"></span>
        </div>
        <textarea id="manual-relations" rows="12" placeholder="One relation per line:&#10;Entity A -> relation -> Entity B&#10;Entity B -> other relation -> Entity C"></textarea>
      </div>
      <div class="manual-actions">
        <button id="manual-save-btn" type="button">Save graph</button>
        <button id="manual-cancel-btn2" type="button" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="graph-section">
    <h2>Knowledge Graph</h2>
    <div id="graph-container"></div>
  </div>

  <div id="history-section">
    <div class="history-header">
      <h2>Graph History</h2>
      <div class="history-header-actions">
        <button id="manual-toggle-btn" type="button">+ Add manually</button>
        <button id="load-latest-btn" type="button">Load latest</button>
      </div>
    </div>
    <div id="graph-history"></div>
  </div>

  <script src="script.js?v=17"></script>
</body>
</html>
