<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Adding article</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Add artice - file with .txt extension</h1>
  <div id="drop-zone">
    Drop file here (.txt)<br />
    <small>Click to browse from computer</small>
    <input id="file-input" type="file" accept=".txt" />
  </div>
  <div id="file-name"></div>
  <div id="title"></div>
  <div id="preview"></div>
  <label for="model-select">Model</label>
  <select id="model-select">
    <optgroup label="Anthropic">
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
      <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
      <option value="claude-opus-4-6">Claude Opus 4.6</option>
    </optgroup>
    <optgroup label="OpenAI">
      <option value="gpt-4o-mini">GPT-4o mini</option>
      <option value="gpt-4o">GPT-4o</option>
    </optgroup>
  </select>
  <br />
  <button id="send-btn" disabled>Send</button>
  <button id="clear-graph-btn" type="button">Clear graph</button>
  <div id="status"></div>

  <script src="script.js"></script>
</body>
</html>
