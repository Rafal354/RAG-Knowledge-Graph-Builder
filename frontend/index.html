<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Knowledge Graph Builder</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <h1>Knowledge Graph Builder</h1>
  <div class="layout">
    <div class="col-left">
      <div id="drop-zone">
        <div class="drop-icon">&#8679;</div>
        <div>Drop .txt file here</div>
        <small>or click to browse</small>
        <input id="file-input" type="file" accept=".txt" />
      </div>
      <div id="file-name"></div>
      <div id="title"></div>
      <div id="preview"></div>
    </div>

    <div class="col-right">
      <label for="model-select">Model</label>
      <select id="model-select">
        <optgroup label="Anthropic">
          <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
          <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
          <option value="claude-opus-4-6">Claude Opus 4.6</option>
        </optgroup>
        <optgroup label="OpenAI">
          <option value="gpt-4o-mini">GPT-4o mini</option>
          <option value="gpt-4o">GPT-4o</option>
        </optgroup>
        <optgroup label="Google">
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
          <option value="gemini-1.5-flash-8b">Gemini 1.5 Flash 8B</option>
        </optgroup>
        <optgroup id="local-models-group" label="Local (LM Studio)">
          <option disabled value="">Loading...</option>
        </optgroup>
      </select>

      <div class="actions">
        <button id="send-btn" disabled>Send</button>
        <button id="clear-graph-btn" class="btn-danger" type="button">Clear graph</button>
      </div>

      <div id="status"></div>
    </div>
  </div>

  <div id="graph-section">
    <h2>Knowledge Graph</h2>
    <div id="graph-container"></div>
  </div>

  <div id="history-section">
    <h2>Graph History</h2>
    <div id="graph-history"></div>
  </div>

  <script src="script.js?v=8"></script>
</body>
</html>
